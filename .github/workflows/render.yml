name: Render video

on:
  workflow_dispatch:
    inputs:
      scene:
        description: "Nome da cena (arquivo em prompts/, sem .json)"
        type: string
        default: cena-01
      source:
        description: "Fonte do vídeo de fundo"
        type: choice
        options: [auto, mock, ai]
        default: auto

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install system libraries for headless Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 \
            libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 \
            libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2

      - name: Install dependencies
        run: npm ci

      - name: Generate background video
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
          SOURCE: ${{ inputs.source }}
          SCENE: ${{ inputs.scene }}
        run: |
          if ! [[ "$SCENE" =~ ^[a-zA-Z0-9-]+$ ]]; then echo "::error::Nome de cena inválido."; exit 1; fi
          if [ "$SOURCE" = "mock" ]; then
            echo "Modo mock escolhido manualmente."
            npm run generate:mock -- "$SCENE"
          elif [ -n "$FAL_KEY" ]; then
            echo "FAL_KEY encontrada: gerando via Fal.ai."
            npm run generate:ai -- "$SCENE"
          elif [ "$SOURCE" = "ai" ]; then
            echo "::error::Modo ai escolhido, mas o secret FAL_KEY não está configurado."
            exit 1
          else
            echo "Sem FAL_KEY: usando mock gratuito."
            npm run generate:mock -- "$SCENE"
          fi

      - name: Render final video
        env:
          SCENE: ${{ inputs.scene }}
        run: npm run render -- "$SCENE"

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ inputs.scene }}
          path: out/
          if-no-files-found: error
          retention-days: 14
